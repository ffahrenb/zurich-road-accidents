project:
  type: website
  output-dir: _site
  pre-render: Rscript _prerender.R
  resources:
    - export
    - assets
    - llms.txt

lang: de
execute:
  echo: false
  warning: false
  message: false
  freeze: false

website:
  title: "Unfälle Zürich"
  site-url: "https://ffahrenb.github.io/zurich-road-accidents/"
  repo-url: "https://github.com/ffahrenb/zurich-road-accidents"
  description: "Strassenverkehrsunfälle der Stadt Zürich {{< var yr_span >}} – offene Daten, automatisch geprüfte Datenqualität, nachvollziehbare Methode."
  back-to-top-navigation: false
  page-footer:
    border: false
    left: "Quelle: Stadt Zürich, Open Data / Bundesamt für Strassen ASTRA, CC BY 4.0"
    right:
      - text: "Datenschutz"
        href: datenschutz.qmd
      - text: "Code"
        href: https://github.com/ffahrenb/zurich-road-accidents
  navbar:
    background: light
    collapse-below: lg
    pinned: false
    title: "Unfälle Zürich"
    left:
      - text: "Übersicht"
        href: index.qmd
      - text: "Datenqualität"
        href: datenqualitaet.qmd
      - text: "Karte"
        href: karte.qmd
      - text: "Wann"
        href: wann.qmd
      - text: "Wo"
        href: wo.qmd
      - text: "Wetter"
        href: wetter.qmd
      - text: "Schwere"
        href: schwere.qmd
      - text: "Daten"
        href: daten.qmd
      - text: "Pipeline"
        href: pipeline.qmd
      - text: "Datenschutz"
        href: datenschutz.qmd
    right:
      - text: "EN"
        href: en/index.qmd
        aria-label: "English summary"

format:
  html:
    theme:
      light: [default, theme-light.scss]
      dark: [default, theme-dark.scss]
    respect-user-color-scheme: true
    css: site.css
    toc: true
    toc-title: "Auf dieser Seite"
    toc-depth: 2
    smooth-scroll: false
    link-external-icon: false
    link-external-newwindow: false
    code-copy: false
    anchor-sections: false
    fig-align: left
    grid:
      sidebar-width: 200px
      body-width: 820px
      margin-width: 200px
      gutter-width: 2rem
    include-in-header:
      - text: |
          <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
          <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
